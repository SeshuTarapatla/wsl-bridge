[project]
name = "wsl-bridge"
version = "0.1.0"
description = "A FastAPI server that works like a bridge between Windows Host machine and WSL instance."
readme = "README.md"
authors = [
    { name = "SeshuTarapatla", email = "seshu.tarapatla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "my-modules",
    "uvicorn>=0.44.0",
]

[project.scripts]
wsl-bridge = "wsl_bridge:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.uv.sources]
# Pinned to the scrcpy adb version-pin fix (D55/D65: scrcpy's bundled adb.exe
# is version-mismatched vs the one actually running the adb server, and
# kills/restarts it on every scrcpy launch unless pointed at the right one -
# via the ADB env var, not a --adb= flag, which scrcpy 3.3.4 doesn't have).
# Not main - the fix lives on an unmerged my-modules branch; pinning the
# exact commit means a future push to that branch can't silently change
# what's resolved.
my-modules = { git = "https://github.com/SeshuTarapatla/my-modules.git", rev = "94b308a" }
